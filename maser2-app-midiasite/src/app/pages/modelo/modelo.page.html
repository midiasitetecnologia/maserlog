<ion-header color="toolbar" class="ion-no-border">

  <ion-toolbar color="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="location.back()">
        <ion-icon name="arrow-back-outline" color="azul-logo" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-thumbnail slot="start">
      <img src="assets/logo-maser.png">
    </ion-thumbnail>
    <ion-title></ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="ellipsis-vertical" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

</ion-header>

<ion-content color="fundo">

  <ion-card mode="ios" class="maser-ion-card-margin">
    <ion-item lines="none">
      <ion-textarea label="Motivo" labelPlacement="stacked"
        placeholder="Informe o motivo" class="maser-ion-input-style">
      </ion-textarea>
    </ion-item>
  </ion-card>

  <ion-card mode="ios" class="maser-ion-card-margin">
    <ion-item lines="none">
      <ion-select mode="md" cancelText="Cancelar" label="A coleta foi realizada?" labelPlacement="stacked"
        placeholder="Sim ou Não">
        <ion-select-option value="S">Sim</ion-select-option>
        <ion-select-option value="N">Não</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-card>

  <ion-card mode="ios" class="maser-ion-card-margin">
    <ion-item lines="none">
      <ion-select mode="md" cancelText="Cancelar" label="Veículo necessário" labelPlacement="stacked"
        placeholder="Selecione o tipo de veículo" interface="action-sheet">
        <ion-select-option value="1">Tipo 1</ion-select-option>
        <ion-select-option value="2">Tipo 2</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-card>

  <ion-card mode="ios" class="maser-ion-card-margin">
    <ion-item lines="none">
      <ion-input label="Recebedor" labelPlacement="stacked" placeholder="Nome do recebedor"
        class="maser-ion-input-style"></ion-input>
    </ion-item>
  </ion-card>

  <ion-button expand="block" (click)="post()">Post</ion-button>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="scan()">
      <ion-icon name="scan"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <ion-fab slot="fixed" vertical="bottom" horizontal="start">
    <ion-fab-button (click)="tirarFoto()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="pegarFotoGaleria()">
      <ion-icon name="image"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
