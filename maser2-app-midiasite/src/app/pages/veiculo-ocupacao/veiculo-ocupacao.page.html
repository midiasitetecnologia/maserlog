<ion-header>
  <ion-toolbar color="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="location.back()" *ngIf="(atualizar == false)">
        <ion-icon name="arrow-back-outline" color="azul-logo" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="(atualizar = false)" *ngIf="(atualizar == true)">
        <ion-icon name="arrow-back-outline" color="azul-logo" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Ocupação do Veículo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="fundo">

  <!-- Ocupação atual -->
  <div *ngIf="(atualizar == false)">

    <ion-card mode="ios">
      <ion-item lines="none">
        <ion-thumbnail slot="start" *ngIf="(motorista.getUrlImgCarga() > '')"
          (click)="global.visualizarFoto(motorista.getUrlImgCarga())">
          <img [src]="motorista.getUrlImgCarga()">
        </ion-thumbnail>
        <!--
      <ion-thumbnail slot="start" *ngIf="(motorista.getUrlImgCarga() == '')">
        <img src="../../assets/sem-foto.jpg">
      </ion-thumbnail>
      -->
        <ion-label>
          <p>Ocupação atual</p>
          <h1>{{ motorista.getOcupVeiculo(true) }}</h1>
        </ion-label>
      </ion-item>
    </ion-card>

    <ion-card mode="ios">
      <ion-item button lines="none" (click)="(atualizar = true)">
        <ion-label color="primary">Atualizar ocupação</ion-label>
        <!--<ion-icon name="chevron-forward-outline" color="primary" slot="end"></ion-icon>-->
      </ion-item>
    </ion-card>
  </div>


  <!-- Atualizar ocupação -->
  <div *ngIf="(atualizar == true)">

    <ion-card mode="ios">
      <!-- Setar ocupação -->
      <ion-item lines="none">
        <ion-label>Ocupação: <b>{{ veiculo.ocup_veiculo }}%</b></ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-range [color]="motorista.getCorOcupVeiculo(veiculo.ocup_veiculo)" [(ngModel)]="veiculo.ocup_veiculo"
          min="0" max="100" step="25" snaps="true" color="primary" pin="true">
          <ion-label slot="start">0%</ion-label>
          <ion-label slot="end">100%</ion-label>
        </ion-range>
      </ion-item>
    </ion-card>

    <ion-card mode="ios">
      <ion-item lines="none">
        <ion-label class="ion-text-wrap">Foto do compartimento de carga</ion-label>
        <ion-thumbnail slot="end" (click)="global.visualizarFoto('data:image/jpeg;base64,' + veiculo.img_base64)"
          *ngIf="(veiculo.img_base64 != '')">
          <img [src]="'data:image/jpeg;base64,' + veiculo.img_base64">
        </ion-thumbnail>
      </ion-item>

      <!-- O ion-grid foi configurado com 16 colunas (global.scss) -->
      <ion-grid fixed>
        <ion-row>
          <ion-col size="8" class="ion-no-padding">
            <ion-button expand="block" fill="outline" (click)="pegarFotoGaleria()">
              Galeria
              <ion-icon name="image-outline" color="primary" slot="start"></ion-icon>
            </ion-button>
          </ion-col>
          <ion-col size="8" class="ion-no-padding">
            <ion-button expand="block" fill="outline" (click)="tirarFoto()">
              Foto
              <ion-icon name="camera-outline" color="primary" slot="start"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>

    <div class="ion-padding">
      <ion-button mode="ios" expand="full" shape="round" (click)="atualizarOcupacaoVeiculo()">
        ATUALIZAR OCUPAÇÃO
      </ion-button>
    </div>

  </div>

</ion-content>
