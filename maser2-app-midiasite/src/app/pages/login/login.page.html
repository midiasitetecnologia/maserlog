<ion-content color="fundo" class="ion-padding">

  <ion-img src="assets/logo-maser-login.png" (click)="clickLogo()"></ion-img>

  <form [formGroup]="fGroup">

    <ion-card mode="ios">

      <ion-item lines="none" class="ion-margin-top">
        <ion-label color="primary" class="ion-text-center">
          <strong>LOGIN</strong>
        </ion-label>

      </ion-item>

      <ion-item lines="full" class="ion-margin">
        <ion-label position="stacked">
          <ion-text color="medium">Usuário</ion-text>
        </ion-label>
        <ion-input type="text" formControlName="email" class="maser-ion-input-style maser-ion-input-uppercase">
        </ion-input>
      </ion-item>
      <!--
      <div *ngIf="fGroup.controls.email.errors" class="ion-text-right">
        <div *ngIf="fGroup.controls.email.errors.required">
          <ion-text color="danger"><sub>Campo obrigatório</sub></ion-text>
        </div>
      </div>
      -->

      <ion-item lines="full" class="ion-margin">
        <ion-label position="stacked">
          <ion-text color="medium">Senha</ion-text>
        </ion-label>
        <ion-input type="password" formControlName="password" class="maser-ion-input-style"></ion-input>
      </ion-item>
      <!--
      <div *ngIf="fGroup.controls.password.errors" class="ion-text-right">
        <div *ngIf="fGroup.controls.password.errors.required">
          <ion-text color="danger"><sub>Campo obrigatório</sub></ion-text>
        </div>
      </div>
      -->

      <ion-card-content>

        <ion-button mode="ios" expand="full" shape="round" (click)="fazerLogin()">ENTRAR
        </ion-button>

      </ion-card-content>

    </ion-card>

    <ion-card mode="ios" style="margin-top: 0px; margin-bottom: 0px;" *ngIf="(global.getModoDeveloper() == 'S')">
      <ion-item lines="none" color="azul-logo">
        <ion-label class="ion-text-center">
          <h2>Modo Developer Ativado</h2>
        </ion-label>
      </ion-item>
    </ion-card> 

  </form>

</ion-content>
