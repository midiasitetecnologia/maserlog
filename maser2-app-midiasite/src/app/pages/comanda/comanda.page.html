<ion-header>
  <ion-toolbar color="toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="location.back()">
        <ion-icon name="arrow-back-outline" color="azul-logo" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Comanda</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <form [formGroup]="fGroup">

    <ion-item>
      <ion-label position="stacked"><ion-text class="maser-ion-text-style">Local de coleta</ion-text></ion-label>
      <ion-input type="text" formControlName="local_coleta" class="maser-ion-input-style"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked"><ion-text class="maser-ion-text-style">Local de entrega</ion-text></ion-label>
      <ion-input type="text" formControlName="local_entrega" class="maser-ion-input-style"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked"><ion-text class="maser-ion-text-style">Observações</ion-text></ion-label>
      <ion-textarea formControlName="obs_coleta" class="maser-ion-input-style"></ion-textarea>
    </ion-item>

    <div class="ion-padding-top">
      <ion-button mode="ios" expand="full" shape="round"  [disabled]="!fGroup.valid"
        *ngIf="(coleta.dadosComandaAtual.coleta_id == '')" (click)="incluirComanda()">
        INCLUIR COMANDA
      </ion-button>

      <ion-button mode="ios" expand="full" shape="round" [disabled]="!fGroup.valid"
        *ngIf="(coleta.dadosComandaAtual.coleta_id != '')" (click)="atualizarComanda()">
        ATUALIZAR COMANDA
      </ion-button>
    </div>

  </form>

</ion-content>
