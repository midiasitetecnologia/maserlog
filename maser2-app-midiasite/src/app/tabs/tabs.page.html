<ion-tabs>

  <ion-tab-bar slot="bottom">

    <ion-tab-button tab="home">
      <ion-icon name="clipboard-outline"></ion-icon>
      <ion-label>Rota</ion-label>
      <ion-badge *ngIf="(coleta.rota.length > 0)">{{ coleta.rota.length }}</ion-badge>
    </ion-tab-button>

    <!--
    <ion-tab-button tab="proximas" *ngIf="(coleta.proximas.length > 0)">
      <ion-icon name="clipboard-outline"></ion-icon>
      <ion-label>Rota</ion-label>
      <ion-badge>{{ coleta.proximas.length }}</ion-badge>
    </ion-tab-button>
    -->

    <ion-tab-button tab="carga">
      <ion-icon name="cube-outline"></ion-icon>
      <ion-label>Carga</ion-label>
      <ion-badge *ngIf="(coleta.carga.length > 0)">{{ coleta.carga.length }}</ion-badge>
    </ion-tab-button>

    <ion-tab-button tab="notificacoes">
      <ion-icon name="notifications-outline"></ion-icon>
      <ion-label>Notificações</ion-label>
      <ion-badge color="danger" *ngIf="(motorista.notifNaoLida > 0)">{{ motorista.notifNaoLida }}</ion-badge>
    </ion-tab-button>

    <ion-tab-button tab="perfil">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Sua conta</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
